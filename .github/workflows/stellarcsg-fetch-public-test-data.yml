name: StellarCSG public test-data fetch

on:
  push:
    branches:
      - codex/stellarcsg-native-csg-foundation-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-data:
    if: github.ref == 'refs/heads/codex/stellarcsg-native-csg-foundation-20260828'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public OpenMC and ParaStell qualification inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/cross_sections artifact/parastell
          branch=magnet-radiation-valid-baseline-and-instrumentation-20260827
          base=https://raw.githubusercontent.com/FusionSandwich/parastell/$branch
          curl --fail --location --retry 4 "$base/tests/files_for_tests/cross_sections/01H_001.h5" -o artifact/cross_sections/01H_001.h5
          curl --fail --location --retry 4 "$base/tests/files_for_tests/cross_sections/cross_sections.xml" -o artifact/cross_sections/cross_sections.xml
          curl --fail --location --retry 4 "$base/examples/wout_vmec.nc" -o artifact/parastell/wout_vmec.nc
          curl --fail --location --retry 4 "$base/examples/coils.example" -o artifact/parastell/coils.example
          printf '%s\n' "$branch" > artifact/parastell/source_branch.txt
          sha256sum artifact/cross_sections/* artifact/parastell/wout_vmec.nc artifact/parastell/coils.example > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stellarcsg-public-qualification-data-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
