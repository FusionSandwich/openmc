name: Materialize StellarCSG executable implementation

on:
  push:
    branches:
      - feature/native-stellarator-csg-openmc-0.16

permissions:
  contents: write

env:
  EXPECTED_BUNDLE_SHA256: 35e89d84cf821d842a0cc42537c4b3fe1ae11a099a97f92c1043c79ac8e1e6ae

jobs:
  materialize:
    if: github.event.head_commit.message == 'Stage StellarCSG executable implementation v2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and extract implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat dev/stellarcsg/.materialize-v2/part-* > "$RUNNER_TEMP/stellarcsg.b64"
          base64 --decode "$RUNNER_TEMP/stellarcsg.b64" > "$RUNNER_TEMP/stellarcsg.tar.gz"
          echo "${EXPECTED_BUNDLE_SHA256}  $RUNNER_TEMP/stellarcsg.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/stellarcsg.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -rf dev/stellarcsg/.materialize dev/stellarcsg/.materialize-v2
      - name: Validate staged files before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool dev/stellarcsg/implementation_manifest.json >/dev/null
          test -s .github/workflows/stellarcsg-ci.yml
          test -s .github/workflows/stellarcsg-openmc-adapter.yml
          test -s dev/stellarcsg/environment.yml
          bash -n dev/stellarcsg/scripts/run_local_validation.sh
          test -x dev/stellarcsg/scripts/run_local_validation.sh
      - name: Commit materialized implementation without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          # The default Actions token is not permitted to add workflow files.
          # Preserve the implementation and let the connected GitHub client add
          # audited workflows in separate commits.
          rm -f .github/workflows/stellarcsg-ci.yml
          rm -f .github/workflows/stellarcsg-openmc-adapter.yml
          git restore .github/workflows/materialize-stellarcsg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dev/stellarcsg
          git commit -m "Implement runnable native StellarCSG prototype"
          git push origin HEAD:feature/native-stellarator-csg-openmc-0.16
