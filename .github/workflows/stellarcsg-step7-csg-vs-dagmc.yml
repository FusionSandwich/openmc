name: StellarCSG Step 7 native CSG versus DAGMC

on:
  push:
    branches:
      - feature/native-stellarator-csg-openmc-0.16
    paths:
      - .github/workflows/stellarcsg-step7-csg-vs-dagmc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out isolated feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run matched comparison in official DAGMC image
        shell: bash
        run: |
          docker pull openmc/openmc:develop-dagmc
          docker run --rm \
            --user root \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e OMP_NUM_THREADS=2 \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            openmc/openmc:develop-dagmc \
            bash dev/stellarcsg/scripts/run_step7_remote.sh

      - name: Commit code and compact remote results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            dev/stellarcsg/openmc_adapter/src/surface_periodic_spline.cpp \
            dev/stellarcsg/openmc_adapter/tests/test_periodic_spline_surface.cpp \
            dev/stellarcsg/examples/step7_matched_csg_dagmc.py \
            dev/stellarcsg/results/step7 \
            dev/stellarcsg/docs/STEP1_TO_STEP7_RESULTS.md \
            dev/stellarcsg/docs/EXECUTION_STATUS.md
          if git diff --cached --quiet; then
            echo 'No Step 7 changes were produced.'
          else
            git commit -m 'Run matched native StellarCSG and DAGMC comparison'
            git push origin HEAD:feature/native-stellarator-csg-openmc-0.16
          fi

      - name: Upload full Step 7 replay bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellarcsg-step7-${{ github.sha }}
          path: dev/stellarcsg/results/step7
          if-no-files-found: error
          retention-days: 90

      - name: Enforce evidence creation
        if: always()
        shell: bash
        run: |
          test -f dev/stellarcsg/results/step7/README.md
          test -f dev/stellarcsg/docs/STEP1_TO_STEP7_RESULTS.md
