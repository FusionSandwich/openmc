name: StellarCSG Step 2 apply and qualify fix

on:
  push:
    branches: [feature/native-stellarator-csg-openmc-0.16]
    paths:
      - '.github/workflows/stellarcsg-step2-apply-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhdf5-dev
      - name: Apply close-pair correction
        run: |
          git apply --3way dev/stellarcsg/patches/step2-close-pair.patch
      - name: Release build and qualification
        run: |
          cmake -S dev/stellarcsg -B build/stellarcsg-step2-fix \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTELLARCSG_ENABLE_HDF5=ON \
            -DSTELLARCSG_BUILD_TESTS=ON \
            -DSTELLARCSG_BUILD_BENCHMARKS=ON \
            -DSTELLARCSG_BUILD_TOOLS=ON
          cmake --build build/stellarcsg-step2-fix --parallel 2
          mkdir -p dev/stellarcsg/results/step2
          ctest --test-dir build/stellarcsg-step2-fix --output-on-failure \
            | tee dev/stellarcsg/results/step2/ctest-release.log
          build/stellarcsg-step2-fix/stellarcsg_adversarial_rays 10000 \
            | tee dev/stellarcsg/results/step2/adversarial-10000.json
          build/stellarcsg-step2-fix/stellarcsg_surface_benchmark \
            | tee dev/stellarcsg/results/step2/microbenchmark.json
          python - <<'PY'
          import json
          path = 'dev/stellarcsg/results/step2/adversarial-10000.json'
          data = json.load(open(path))
          for name, case in data['cases'].items():
              assert case['classification_mismatches'] == 0, (name, case)
              assert case['distance_mismatches'] == 0, (name, case)
          PY
      - name: Sanitizer build and qualification
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S dev/stellarcsg -B build/stellarcsg-step2-fix-sanitize \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSTELLARCSG_ENABLE_HDF5=ON \
            -DSTELLARCSG_ENABLE_SANITIZERS=ON \
            -DSTELLARCSG_BUILD_TESTS=ON \
            -DSTELLARCSG_BUILD_BENCHMARKS=OFF \
            -DSTELLARCSG_BUILD_TOOLS=ON
          cmake --build build/stellarcsg-step2-fix-sanitize --parallel 2
          ctest --test-dir build/stellarcsg-step2-fix-sanitize --output-on-failure \
            | tee dev/stellarcsg/results/step2/ctest-sanitizer.log
          build/stellarcsg-step2-fix-sanitize/stellarcsg_adversarial_rays 1000 \
            | tee dev/stellarcsg/results/step2/adversarial-sanitizer-1000.json
      - name: Record compact evidence
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('dev/stellarcsg/results/step2/README.md').write_text(f'''# Step 2 remote qualification

The close-root-pair correction was applied and qualified on GitHub Actions.

- Trigger commit: `{os.environ["TRIGGER_SHA"]}`
- Release CTest: `ctest-release.log`
- 10,000 random rays plus deterministic edge fixtures: `adversarial-10000.json`
- ASan/UBSan evidence: `ctest-sanitizer.log` and `adversarial-sanitizer-1000.json`
- Microbenchmark: `microbenchmark.json`

The three original failing rays are permanent regression cases in
`tests/test_compiled_surface.cpp`.
''')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dev/stellarcsg/src/periodic_radial_surface.cpp \
                  dev/stellarcsg/tests/test_compiled_surface.cpp \
                  dev/stellarcsg/tools/adversarial_rays.cpp \
                  dev/stellarcsg/results/step2
          git commit -m 'Qualify StellarCSG fast nearest-root search remotely'
          git push origin HEAD:feature/native-stellarator-csg-openmc-0.16
      - uses: actions/upload-artifact@v4
        with:
          name: stellarcsg-step2-corrected-${{ github.sha }}
          path: dev/stellarcsg/results/step2/
          retention-days: 90
